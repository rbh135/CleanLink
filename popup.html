<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean Link</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      width: 300px;
      margin: 0;
      padding: 14px 16px;
      background: #ffffff;
      color: #1a1a1a;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 12px;
      letter-spacing: -0.01em;
    }

    /* Status line – state is set via className in popup.js */
    #status {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    #status.working { color: #6b7280; }  /* gray    – initial state  */
    #status.success { color: #166534; }  /* green   – trackers found */
    #status.clean   { color: #1d4ed8; }  /* blue    – already clean  */
    #status.error   { color: #991b1b; }  /* red     – failure        */

    /* URL preview box */
    #url-box {
      display: none;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 5px;
      padding: 7px 10px;
      font-size: 11px;
      word-break: break-all;
      color: #374151;
      /* Allow the user to select and copy manually as a fallback */
      user-select: all;
      cursor: text;
    }
  </style>
</head>
<body>
  <header>
    <h1>Clean Link</h1>
  </header>

  <div id="status" class="working">Cleaning URL&#x2026;</div>
  <div id="url-box"></div>

  <!-- clean-url.js must load before popup.js so cleanUrl() is defined. -->
  <script src="clean-url.js"></script>
  <script src="popup.js"></script>
</body>
</html>
